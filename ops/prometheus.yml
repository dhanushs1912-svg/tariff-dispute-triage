global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: llm-gateway
    static_configs: [{ targets: ["llm-gateway:8001"] }]
  - job_name: llm-stub
    static_configs: [{ targets: ["llm-stub:8080"] }]
  # Workers are discovered by DNS so every replica of `--scale researcher=N` is scraped.
  - job_name: researcher
    dns_sd_configs: [{ names: ["researcher"], type: A, port: 9100, refresh_interval: 10s }]
  - job_name: verifier
    dns_sd_configs: [{ names: ["verifier"], type: A, port: 9100, refresh_interval: 10s }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: jaeger
    static_configs: [{ targets: ["jaeger:14269"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
