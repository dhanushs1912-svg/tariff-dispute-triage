# docker compose up --build            (first run; afterwards `docker compose up`)
# docker compose up --scale researcher=3
# Service boundaries are justified in docs/architecture.md.

x-app: &app
  image: tariff-triage:local
  build:
    context: .
    args:
      EMBED_MODEL: ${EMBED_MODEL}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-http-health: &http-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes: [chroma-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q nanosecond <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  llm-stub:
    <<: *app
    command: ["python", "-m", "uvicorn", "triage.stub:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]

  llm-gateway:
    <<: *app
    command: ["python", "-m", "uvicorn", "triage.gateway:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: { SERVICE_NAME: llm-gateway }
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      llm-stub: { condition: service_healthy }
      jaeger: { condition: service_started }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]

  ingest:
    <<: *app
    command: ["python", "-m", "triage.ingest"]
    restart: "no"
    depends_on:
      chroma: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *app
    command: ["python", "-m", "uvicorn", "triage.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment: { SERVICE_NAME: api }
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]

  researcher:
    <<: *app
    command: ["python", "-m", "triage.worker", "research"]
    environment: { SERVICE_NAME: researcher }
    depends_on:
      ingest: { condition: service_completed_successfully }
      llm-gateway: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]

  verifier:
    <<: *app
    command: ["python", "-m", "triage.worker", "verify"]
    environment: { SERVICE_NAME: verifier }
    depends_on:
      ingest: { condition: service_completed_successfully }
      llm-gateway: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triage.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: ${REDIS_URL}
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------- tools (not started by `up`)
  eval:
    <<: *app
    profiles: [tools]
    entrypoint: ["python", "-m", "triage.evaluate"]
    command: []
    restart: "no"
    environment: { EVAL_DIR: /app/eval, EVAL_API_URL: "http://api:8000" }
    volumes: ["./eval:/app/eval"]
    depends_on:
      api: { condition: service_healthy }

  loadtest:
    image: locustio/locust:2.47.0
    profiles: [tools]
    working_dir: /mnt/locust
    volumes: ["./loadtest:/mnt/locust"]
    environment:
      RESULTS_DIR: /mnt/locust/results
      RUN_LOG: ${RUN_LOG:-runs.csv}
      USERS: ${USERS:-}
      STAGES: ${STAGES:-2:120,5:120,10:150,15:150,20:150,30:150}
    command: >
      -f /mnt/locust/locustfile.py --headless --host http://api:8000
      --csv /mnt/locust/results/locust --html /mnt/locust/results/report.html
      ${LOCUST_ARGS:-}
    depends_on:
      api: { condition: service_healthy }

volumes:
  redis-data:
  pg-data:
  chroma-data:
  prom-data:
  grafana-data:
